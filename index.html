<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2457D6">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<!--PREVIEW-START-->
<title>パーク回遊ナビ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Maru+Gothic:wght@700&display=swap">
<style>
/* レイアウト：スマホ1画面＋下タブ。カードは「要素ごとの役割」で使い分け */
:root{
  --bg:#F4F6FA; --card:#FFFFFF; --ink:#172036; --sub:#4A5368; --en:#5A6378; --line:#DCE1EA; --soft:#EEF1F6;
  --accent:#2457D6; --accent-ink:#FFFFFF; --accent-soft:#E6EEFF; --accent-text:#1E46B0;
  --warn-bg:#FFF1E0; --warn:#8A4200; --show-bg:#EFEAFD; --show:#4B2FA6; --ok:#1E46B0;
  --map:#EEF3EC; --pin:#172036; --pin-ink:#FFFFFF; --route:#D97706;
  --font:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141F; --card:#1A2030; --ink:#E9EDF5; --sub:#AEB6C7; --en:#9AA3B6; --line:#2C3447; --soft:#232A3B;
  --accent:#6E95F5; --accent-ink:#0D1530; --accent-soft:#22305A; --accent-text:#B9CCFF;
  --warn-bg:#3A2610; --warn:#FFC98A; --show-bg:#2C2550; --show:#D4C8FF; --ok:#B9CCFF;
  --map:#1C2A22; --pin:#E9EDF5; --pin-ink:#10141F; --route:#F5A524; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141F; --card:#1A2030; --ink:#E9EDF5; --sub:#AEB6C7; --en:#9AA3B6; --line:#2C3447; --soft:#232A3B;
  --accent:#6E95F5; --accent-ink:#0D1530; --accent-soft:#22305A; --accent-text:#B9CCFF;
  --warn-bg:#3A2610; --warn:#FFC98A; --show-bg:#2C2550; --show:#D4C8FF; --ok:#B9CCFF;
  --map:#1C2A22; --pin:#E9EDF5; --pin-ink:#10141F; --route:#F5A524; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px}
.top-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{margin:0;font-family:var(--display);font-size:22px;line-height:1.2;text-wrap:balance}
h2{margin:0;font-size:15px}
.meta{font-size:12px;color:var(--sub)}
main{flex:1;padding:14px 16px 96px;display:flex;flex-direction:column;gap:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
nav.tabs button{height:60px;border:0;background:none;font-size:13px;color:var(--sub);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px}
.seg button{min-height:44px;border-radius:12px;font-size:13px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 6px;line-height:1.25}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.seg .en{color:inherit;opacity:.85}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 10px;border-radius:10px;background:var(--soft);color:var(--sub);line-height:1.5}
.chip.ok{background:var(--accent-soft);color:var(--accent-text)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.show{background:var(--show-bg);color:var(--show)}
.filter{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.filter::-webkit-scrollbar{display:none}
.filter button{flex-shrink:0;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:13px}
.filter button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--card);border-radius:16px;padding:14px}
.card.hero{box-shadow:0 1px 3px rgba(23,32,54,.10);display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;font-weight:700;color:var(--accent)}
.name{display:flex;flex-direction:column;min-width:0}
.name .ja{font-weight:700}
.en{font-size:12px;color:var(--en)}
.land{font-size:12px;color:var(--sub)}
.big{font-size:28px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:14px;padding:0 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{border-color:var(--accent);color:var(--accent);font-weight:700}
.alert{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:13px}
.list{background:var(--card);border-radius:16px;display:flex;flex-direction:column}
.list>.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--soft)}
.list>.li:last-child{border-bottom:0}
.li.done{opacity:.55}
.wait{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.wait small{display:block;font-size:11px;font-weight:400;color:var(--sub)}
.item{background:var(--card);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.item input[type=checkbox]{width:24px;height:24px;margin:2px 0 0;accent-color:var(--accent);flex-shrink:0}
.item .body{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.sub-form{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.sub-form select,.sub-form input,.field input,.field select{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px}
label.toggle{display:flex;align-items:center;gap:8px;min-height:36px;font-size:13px}
.toggles{display:flex;flex-wrap:wrap;column-gap:16px}
.searchrow input{width:100%;min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:14px}
label.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.progress{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:4px}
.tl{background:var(--card);border-radius:14px;padding:4px 12px 8px}
.tl .r{display:grid;grid-template-columns:42px minmax(0,1fr) 108px;gap:8px;padding:9px 0;border-bottom:1px solid var(--soft);align-items:start}
.tl .tlbody{display:flex;gap:8px;align-items:flex-start;min-width:0}
.tl .tlbody.wide{grid-column:2 / 4}
.tl .tlmain{display:flex;flex-direction:column;min-width:0}
.num.ghost{visibility:hidden}
.tl .r:last-child{border-bottom:0}
.tl .h{font-size:11px;font-weight:700;color:var(--sub);border-bottom:1px solid var(--line)}
.tl .t{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.tl .free{font-size:13px;color:var(--sub)}
.lane{border-radius:8px;padding:5px 7px;display:flex;flex-direction:column;font-size:12px;line-height:1.35;background:var(--show-bg);color:var(--show)}
.lane b{font-size:12px}
.lane.conflict{background:var(--warn-bg);color:var(--warn)}
.lane.mine{outline:2px solid var(--show)}
.lane.conflict.mine{outline-color:var(--warn)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.daysel{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.daysel button{flex-shrink:0;min-height:48px;padding:4px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:13px;line-height:1.3}
.daysel button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-items:end;min-height:112px}
.bars div.mine{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.bars em{font-style:normal;font-size:10px;color:var(--sub);white-space:nowrap}
.bars i.lv1{background:#BFD3F7}.bars i.lv2{background:#8FB0F0}.bars i.lv3{background:#5E8BE6}.bars i.lv4{background:#2F62D4}.bars i.lv5{background:#1B3E99}
.bars div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-variant-numeric:tabular-nums}
.bars i{display:block;width:100%;border-radius:6px;background:var(--accent)}
.map{width:100%;height:auto;display:block;border-radius:12px;background:var(--map)}
/* 地図は明るい「紙の地図」で固定（どちらのテーマでも同じ見た目） */
.map text{font-family:var(--font)}
.map .halo{paint-order:stroke;stroke:#FFFFFF;stroke-width:.75px;stroke-linejoin:round}
.mapbtn{display:block;width:100%;padding:0;border:0;background:none;border-radius:12px;overflow:hidden}
.mapfull{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.mapfull-bar{display:flex;align-items:center;gap:8px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.mapfull-bar b{flex:1;font-size:16px}
.mapfull-body{flex:1;overflow:auto;padding:12px 16px;display:flex;flex-direction:column;gap:12px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.dot.big{width:14px;height:14px;margin-right:7px;vertical-align:-2px}
.num{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:#2457D6;color:#FFFFFF;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.k.pinkey,.k.babykey,.k.aidkey{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:700}
.k.pinkey{background:#2457D6;color:#FFFFFF}
.k.babykey{background:#D94F8C;color:#FFFFFF}
.k.aidkey{background:#FFFFFF;color:#D3463B;border:1.5px solid #D3463B}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px}
.legend>span{display:block;line-height:1.7}
.legend span.k{display:inline-block;vertical-align:middle;margin-right:6px}
.legend span.k.pinkey,.legend span.k.babykey,.legend span.k.aidkey{display:inline-flex;align-items:center;justify-content:center}
.empty{color:var(--sub);font-size:13px;padding:6px 2px}
.filtbar{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:0;text-align:left;min-height:44px}
.filtbar .ftitle{flex:1;display:flex;flex-direction:column;min-width:0}
.filtbar .fh{font-family:var(--display);font-size:20px;line-height:1.25}
.filtbar .fsum{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filtbar .fbtn{font-size:13px;font-weight:700;color:var(--accent-text);background:var(--accent-soft);border-radius:16px;padding:6px 12px;white-space:nowrap}
.filtbar[aria-expanded="true"] .chev{transform:rotate(180deg)}
.filtpanel{display:flex;flex-direction:column;gap:10px}
.grpbar{display:flex;align-items:center;gap:8px}
.grpbar .meta{flex:1}
.btn.small{min-height:36px;font-size:12px;padding:0 10px;border-radius:10px}
.grp{background:var(--card);border-radius:16px;overflow:hidden}
.grphead{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;border:0;background:none;text-align:left;min-height:56px}
.grphead:disabled{cursor:default;opacity:1}
.grptitle{flex:1;display:flex;flex-direction:column;min-width:0}
.grptitle .ja{font-size:15px;font-weight:700}
.grpsum{font-size:12px;color:var(--sub)}
.grpon{font-size:12px;font-weight:700;color:var(--accent-text);background:var(--accent-soft);border-radius:10px;padding:2px 8px;white-space:nowrap}
.chev{width:20px;height:20px;flex-shrink:0;fill:none;stroke:var(--sub);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.grphead[aria-expanded="true"] .chev{transform:rotate(180deg)}
.grphead:disabled .chev{display:none}
.grpbody{display:flex;flex-direction:column;border-top:1px solid var(--soft)}
.grpbody .item{border-radius:0;border-bottom:1px solid var(--soft);padding:12px 14px}
.grpbody .item:last-child{border-bottom:0}
details.more summary{font-size:12px;color:var(--accent-text);cursor:pointer;min-height:28px;display:flex;align-items:center}
details.more .note{display:block;margin-top:2px}
.note{font-size:12px;color:var(--sub)}
.ico{flex-shrink:0;display:block;border-radius:10px}
.favbtn{flex-shrink:0;width:44px;height:44px;margin:-8px -10px -8px 0;border:0;background:none;display:flex;align-items:center;justify-content:center;border-radius:22px}
.favbtn svg{width:24px;height:24px;fill:none;stroke:var(--sub);stroke-width:1.8;stroke-linejoin:round}
.favbtn[aria-pressed="true"] svg{fill:#F2B705;stroke:#C99400}
.favmark{display:inline-flex;flex-shrink:0}
.favmark svg{width:16px;height:16px;fill:#F2B705;stroke:#C99400;stroke-width:1.5;stroke-linejoin:round}
.grpfav{display:inline-flex;align-items:center;gap:2px;font-size:12px;font-weight:700;color:#A67A00;white-space:nowrap}
.grpfav svg{width:14px;height:14px;fill:#F2B705;stroke:#C99400;stroke-width:1.5}
.tlname{display:flex;gap:8px;align-items:flex-start;min-width:0}
.maphint{margin:0;font-size:12px;color:var(--accent-text);background:var(--accent-soft);border-radius:10px;padding:8px 10px}
.map.tap [data-act]{cursor:pointer}
.mapsheet{flex-shrink:0;max-height:52vh;display:flex;flex-direction:column;background:var(--card);border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.14)}
.mapsheet-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--soft)}
.mapsheet-head .grptitle .ja{font-size:16px}
.mapsheet-list{overflow-y:auto;padding:0 16px 12px;-webkit-overflow-scrolling:touch}
.mgrp{font-size:11px;font-weight:700;color:var(--sub);padding:12px 0 2px}
.mrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--soft)}
.mrow:last-child{border-bottom:0}
.mrow.sel{background:var(--accent-soft);margin:8px -16px 0;padding:10px 16px;border-bottom:0}
.mbody{flex:1;display:flex;flex-direction:column;min-width:0}
.mname{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.mcheck{flex-shrink:0;min-height:36px;padding:0 10px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap}
.mcheck[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mrow .favbtn{margin:0 -10px 0 -4px}
.legend span.k.favmark{display:inline-flex;vertical-align:middle}
.chip.genre{background:#FFF1DC;color:#8A4B00}
.menu{display:flex;flex-direction:column;font-size:13px;line-height:1.45;background:var(--soft);border-radius:10px;padding:7px 10px}
.menuhd,.movehd{font-size:11px;font-weight:700;color:var(--sub)}
.move{display:flex;flex-direction:column;gap:2px;font-size:13px;background:var(--soft);border-radius:10px;padding:8px 10px;margin-top:2px}
.move.loop{gap:0}
.stops{list-style:none;margin:4px 0 4px;padding:0;display:flex;flex-direction:column;position:relative}
.stops li{display:flex;align-items:flex-start;gap:8px;position:relative;padding:3px 0;font-weight:700;font-size:13px;line-height:1.35}
.stops li span{display:flex;flex-direction:column}
.stops li .en{font-weight:400}
.stops li i{flex-shrink:0;width:12px;height:12px;border-radius:50%;margin-top:3px;border:2px solid #7A5236;box-sizing:border-box;position:relative;z-index:1}
.stops li:not(:last-child)::before{content:"";position:absolute;left:5px;top:12px;bottom:-6px;width:2px;background:#7A5236}
.stops li.out i{border-style:dashed}
.stops li.back{font-weight:400;color:var(--sub)}
.stops li.back i{background:none;border-color:var(--sub)}
.mrow .move{margin-top:6px}
.herechip{display:inline-block;align-self:flex-start;margin:2px 0;font-size:10px;font-weight:700;color:#FFFFFF;background:#2457D6;border-radius:8px;padding:1px 6px;vertical-align:1px}
.stops li.here i{box-shadow:0 0 0 3px rgba(36,87,214,.35)}
.k.stkey,.k.monokey{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;font-size:10px;font-weight:700;color:#FFFFFF;margin-left:4px}
.k.stkey{background:#7A5236;border-radius:50%}
.k.monokey{background:#1F7A8C;border-radius:5px}
.legend span.k.stkey,.legend span.k.monokey{display:inline-flex}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.genre{background:#4A3418;color:#FFD9A8}}
:root[data-theme="dark"] .chip.genre{background:#4A3418;color:#FFD9A8}
a.namelink{color:inherit;text-decoration:none;-webkit-tap-highlight-color:rgba(36,87,214,.15)}
a.namelink .ja{text-decoration:underline;text-decoration-color:var(--line);text-decoration-thickness:1px;text-underline-offset:3px}
svg.ext{display:inline-block;width:.8em;height:.8em;margin-left:3px;vertical-align:-.02em;fill:none;stroke:var(--accent-text);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.menulink{align-self:flex-start;margin-top:4px;font-size:12px;font-weight:700;color:var(--accent-text);text-decoration:none;min-height:28px;display:inline-flex;align-items:center}
.roomcode{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;font-weight:700;letter-spacing:.04em;text-align:center;background:var(--soft);border-radius:10px;padding:12px 8px;user-select:all;-webkit-user-select:all;word-break:break-all}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
<!--PREVIEW-HEAD-END-->
</head>
<body>
<!--PREVIEW-BODY-START-->
<div class="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="画面の切り替え"><div class="in" id="tabs"></div></nav>
<div id="overlay"></div>
<script src="data.js"></script>
<script src="map.js"></script>
<script src="guide.js"></script>
<script src="icons.js"></script>
<script src="links.js"></script>
<script src="app.js"></script>
<!--PREVIEW-BODY-END-->
</body>
</html>
